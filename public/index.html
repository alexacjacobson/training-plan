<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Road to the Golden Gate 5K</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky-top:#E8A24A;
    --sky-mid:#C1502E;
    --sky-bot:#5C3A21;
    --paper:#FBF6EC;
    --paper-line:#E4D3B8;
    --ink:#4A2E1C;
    --pumpkin:#D9772E;
    --rust:#A6401F;
    --mustard:#E0A937;
    --done-bg:#E3DED2;
    --done-border:#C9C1AE;
    --done-text:#8C8478;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Quicksand',sans-serif;
    background:var(--paper);
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:10px;
  }
  .sheet{
    width:100%;
    max-width:800px;
    background:var(--paper);
    border:2px solid var(--paper-line);
    border-radius:16px;
    overflow:hidden;
    position:relative;
    box-shadow:0 4px 18px rgba(90,50,20,0.12);
  }
  header{
    background:var(--rust);
    padding:16px 22px 14px;
    text-align:center;
  }
  header h1{
    font-family:'Playfair Display',serif;
    color:#FFF5E4;
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:0.3px;
  }
  header p{
    margin:0;
    color:#FBE3C2;
    font-size:13.5px;
    font-weight:600;
  }
  .scroll-hint{
    text-align:center;
    font-size:10.5px;
    color:#9A7B54;
    padding:6px 0 0;
    font-weight:600;
  }
  .table-wrap{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:8px 0 4px;
    margin:0 4px;
  }
  table{border-collapse:collapse; width:max-content; min-width:100%;}
  td.wk{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:13px;
    color:var(--rust);
    white-space:nowrap;
    padding:5px 10px 5px 14px;
    vertical-align:middle;
    width:88px;
    position:sticky;
    left:0;
    background:var(--paper);
    z-index:2;
    box-shadow:2px 0 5px rgba(90,50,20,0.06);
  }
  td.wk span{
    display:block;
    font-family:'Quicksand',sans-serif;
    font-weight:600;
    font-size:9.5px;
    color:#8A6A48;
  }
  .row{border-bottom:1px dashed var(--paper-line);}
  .row:last-child{border-bottom:none;}
  .cell{
    padding:4px 5px;
    vertical-align:middle;
    width:145px;
    min-width:145px;
  }
  .cell.wide{width:220px; min-width:220px;}
  label.task{
    display:flex;
    align-items:flex-start;
    gap:5px;
    background:#fff;
    border:none;
    border-radius:9px;
    padding:5px 7px;
    cursor:pointer;
    box-shadow:0 1px 3px rgba(90,50,20,0.08), 0 2px 8px rgba(90,50,20,0.06);
    transition:background .2s, box-shadow .2s, color .2s;
    min-height:34px;
  }
  label.task:hover{box-shadow:0 2px 6px rgba(90,50,20,0.12), 0 4px 14px rgba(90,50,20,0.10);}
  label.task.done{
    background:var(--done-bg);
    box-shadow:none;
  }
  label.task.done .label{
    text-decoration:line-through;
    color:var(--done-text);
  }
  label.task input{
    margin-top:2px;
    accent-color:var(--rust);
    width:14px;height:14px;
    flex-shrink:0;
  }
  .label{font-size:11.3px;line-height:1.25;font-weight:600;}
  .cross .label{color:#6B7A5E;}
  .cross .task.done .label{color:var(--done-text);}
  .race .task .label{font-weight:700;color:var(--rust);}
  .race .task.done .label{color:var(--done-text);}

  .tracker{
    margin:10px 18px 14px;
    padding:12px 16px;
    background:#fff;
    border-radius:14px;
    box-shadow:0 1px 3px rgba(90,50,20,0.08), 0 2px 8px rgba(90,50,20,0.06);
  }
  .tracker h2{
    font-family:'Playfair Display',serif;
    font-size:15px;
    margin:0 0 8px;
    color:var(--ink);
  }
  .bar-wrap{
    position:relative;
    background:#EADFC5;
    border:1px solid var(--paper-line);
    border-radius:20px;
    height:20px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--mustard),var(--pumpkin),var(--rust));
    transition:width .5s ease;
    border-radius:20px 0 0 20px;
  }
  .stats{
    display:flex;
    justify-content:space-between;
    font-size:11.5px;
    font-weight:700;
    margin-top:6px;
    color:var(--ink);
  }
  .tracker .fine{font-weight:500;font-size:10px;color:#8A6A48;display:block;margin-top:3px;}

  .celebrate{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:opacity .45s ease;
  }
  .celebrate .wash{
    position:absolute;
    inset:0;
    background:var(--rust);
    opacity:0;
    transition:opacity .7s ease;
  }
  .celebrate canvas{position:absolute;inset:0;width:100%;height:100%;}
  .celebrate .msg{
    position:relative;
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:clamp(34px,8vw,64px);
    line-height:1.15;
    color:#fff;
    text-align:center;
    padding:0 24px;
    opacity:0;
    transform:scale(.7);
    transition:opacity .5s ease, transform .65s cubic-bezier(.2,.9,.3,1.25);
  }
  .celebrate.show-wash .wash{opacity:1;}
  .celebrate.show-msg .msg{opacity:1;transform:scale(1);}
  .celebrate.out{opacity:0;}
  @media (prefers-reduced-motion:reduce){
    .celebrate .msg{transform:none;}
  }
  @media (max-width:480px){
    header h1{font-size:21px;}
    .label{font-size:10.5px;}
  }
</style>
</head>
<body>
<div class="sheet" id="sheet">

  <header>
    <h1>🍂 Your Road to the Golden Gate 5K 🍁</h1>
    <p>Race Day: Sunday, November 1, 2026 · San Francisco</p>
  </header>

  <div class="scroll-hint">← swipe to see the full week →</div>

  <div class="table-wrap">
    <table id="plan"></table>
  </div>

  <div class="tracker">
    <h2>🍁 Mileage Tracker</h2>
    <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>
    <div class="stats">
      <span id="statMiles">0.0 mi logged</span>
      <span id="statTime">0 min moved</span>
    </div>
    <span class="fine" id="statFine"></span>
  </div>

</div>

<script>
const sessions = [
  {wk:1, dates:"Sep 14–20", label:"Run 1 / Walk 2 ×6", run:6, walk:12},
  {wk:1, dates:"Sep 14–20", label:"Run 1 / Walk 2 ×6", run:6, walk:12},
  {wk:1, dates:"Sep 14–20", label:"Run 1 / Walk 2 ×6", run:6, walk:12},

  {wk:2, dates:"Sep 21–27", label:"Run 2 / Walk 2 ×5", run:10, walk:10},
  {wk:2, dates:"Sep 21–27", label:"Run 2 / Walk 2 ×5", run:10, walk:10},
  {wk:2, dates:"Sep 21–27", label:"Run 2 / Walk 2 ×5", run:10, walk:10},

  {wk:3, dates:"Sep 28–Oct 4", label:"Run 3 / Walk 2 ×4", run:12, walk:8},
  {wk:3, dates:"Sep 28–Oct 4", label:"Run 3 / Walk 2 ×4", run:12, walk:8},
  {wk:3, dates:"Sep 28–Oct 4", label:"Run 3 / Walk 2 ×4", run:12, walk:8},

  {wk:4, dates:"Oct 5–11", label:"Run 5 / Walk 2 ×3", run:15, walk:6},
  {wk:4, dates:"Oct 5–11", label:"Run 5 / Walk 2 ×3", run:15, walk:6},
  {wk:4, dates:"Oct 5–11", label:"Run 5 / Walk 2 ×3", run:15, walk:6},

  {wk:5, dates:"Oct 12–18", label:"Run 8/Walk 1.5 ×2 + Run 5", run:21, walk:3},
  {wk:5, dates:"Oct 12–18", label:"Run 8/Walk 1.5 ×2 + Run 5", run:21, walk:3},
  {wk:5, dates:"Oct 12–18", label:"Run 10 / Walk 2 ×2 (longest)", run:20, walk:4},

  {wk:6, dates:"Oct 19–25", label:"Run 12 / Walk 1 ×2", run:24, walk:2},
  {wk:6, dates:"Oct 19–25", label:"Run 15 / Walk 2 / Run 8", run:23, walk:2},
  {wk:6, dates:"Oct 19–25", label:"Dress rehearsal: 20–25 min continuous", run:25, walk:0},

  {wk:7, dates:"Oct 26–Nov 1", label:"Easy 15 min jog/walk", run:10, walk:5},
  {wk:7, dates:"Oct 26–Nov 1", label:"10 min shakeout jog", run:10, walk:0},
];
const crossTrainByWeek = {
  1:"🧘🚴 Cross-train (optional)", 2:"🧘🚴 Cross-train (optional)", 3:"🧘🚴 Cross-train (optional)",
  4:"🧘🚴 Cross-train (optional)", 5:"🧘🚴 Cross-train (optional)", 6:"🧘🚴 Cross-train (optional)",
  7:"🧘🚴 Cross-train (optional)"
};
const race = {label:"🏁 RACE DAY — Golden Gate 5K (3.1 mi)"};

// Defaults for a first visit; overridden by paces saved with progress.
let paceRun = 12;   // min per mile, easy jog
let paceWalk = 20;  // min per mile, relaxed walk
function distFor(s){ return s.run/paceRun + s.walk/paceWalk; }

const table = document.getElementById('plan');
let checks = new Array(sessions.length).fill(false);
let crossChecks = {1:false,2:false,3:false,4:false,5:false,6:false,7:false};
let raceChecked = false;

function buildTable(){
  let html = "";
  let i = 0;
  while(i < sessions.length){
    const wk = sessions[i].wk, dates = sessions[i].dates;
    let rowCells = "";
    let count = 0;
    while(i < sessions.length && sessions[i].wk === wk && count < 3){
      rowCells += cellHTML(i);
      i++; count++;
    }
    rowCells += `<td class="cell wide cross">
      <label class="task" for="cross${wk}">
        <input type="checkbox" id="cross${wk}" data-wk="${wk}">
        <span class="label">${crossTrainByWeek[wk]}</span>
      </label>
    </td>`;
    html += `<tr class="row"><td class="wk">Week ${wk}<span>${dates}</span></td>${rowCells}</tr>`;
  }
  html += `<tr class="row race"><td class="wk">Week 7<span>Nov 1</span></td>
            <td class="cell wide" colspan="4">
              <label class="task" for="raceCheck">
                <input type="checkbox" id="raceCheck">
                <span class="label">${race.label}</span>
              </label>
            </td></tr>`;
  table.innerHTML = html;
}
function cellHTML(idx){
  const s = sessions[idx];
  return `<td class="cell">
    <label class="task" for="chk${idx}">
      <input type="checkbox" id="chk${idx}" data-idx="${idx}">
      <span class="label">${s.label}</span>
    </label>
  </td>`;
}

function wireEvents(){
  sessions.forEach((s,idx)=>{
    const chk = document.getElementById('chk'+idx);
    chk.addEventListener('change', ()=>{
      checks[idx] = chk.checked;
      chk.closest('label.task').classList.toggle('done', checks[idx]);
      if(checks[idx]) celebrate();
      save(); render();
    });
  });
  Object.keys(crossChecks).forEach(wk=>{
    const chk = document.getElementById('cross'+wk);
    chk.addEventListener('change', ()=>{
      crossChecks[wk] = chk.checked;
      chk.closest('label.task').classList.toggle('done', crossChecks[wk]);
      if(crossChecks[wk]) celebrate();
      save();
    });
  });
  const raceChk = document.getElementById('raceCheck');
  raceChk.addEventListener('change', ()=>{
    raceChecked = raceChk.checked;
    raceChk.closest('label.task').classList.toggle('done', raceChecked);
    if(raceChecked) celebrate();
    save(); render();
  });
}

function syncBox(id, on){
  const chk = document.getElementById(id);
  chk.checked = on;
  chk.closest('label.task').classList.toggle('done', on);
}
function syncCheckboxes(){
  sessions.forEach((s,idx)=> syncBox('chk'+idx, checks[idx]));
  Object.keys(crossChecks).forEach(wk=> syncBox('cross'+wk, crossChecks[wk]));
  syncBox('raceCheck', raceChecked);
}

function render(){
  let totalMiles = 0, totalMin = 0, planMiles = 0;
  sessions.forEach((s,idx)=>{
    planMiles += distFor(s);
    if(checks[idx]){ totalMiles += distFor(s); totalMin += s.run + s.walk; }
  });
  const pct = Math.min(100, (totalMiles/planMiles)*100);
  document.getElementById('barFill').style.width = pct + "%";
  document.getElementById('statMiles').textContent = totalMiles.toFixed(1) + " mi logged";
  document.getElementById('statTime').textContent = totalMin + " min moved";
  document.getElementById('statFine').textContent = raceChecked
    ? "🏁 Race complete — 3.1 miles, and every step before it! 🍂"
    : "Estimated at your jog/walk paces · " + planMiles.toFixed(1) + " training mi planned, then 3.1 mi on race day";
}

const CHEERS = ["Nice one!", "Way to push it!", "Great effort today!", "Way to get after it!"];
const REPEAT_CHEER = "She did it again!";
let lastCheer = null;
let activeCelebration = null;

function loggedCount(){
  return checks.filter(Boolean).length
    + Object.values(crossChecks).filter(Boolean).length
    + (raceChecked ? 1 : 0);
}
function pickCheer(){
  // Called after the new check is recorded, so >1 means something was already logged.
  const pool = loggedCount() > 1 ? [...CHEERS, REPEAT_CHEER] : CHEERS;
  const options = pool.filter(c => c !== lastCheer);
  lastCheer = options[Math.floor(Math.random()*options.length)];
  return lastCheer;
}

function newSparkle(W, H, initial){
  return {
    x: Math.random()*W,
    y: initial ? Math.random()*H : -10 - Math.random()*40,
    vx: (Math.random()-0.5)*50,
    vy: 60 + Math.random()*180,
    size: 3 + Math.random()*9,
    rot: Math.random()*Math.PI,
    spin: (Math.random()-0.5)*3,
    phase: Math.random()*Math.PI*2,
    delay: initial ? Math.random()*650 : 0,
  };
}
function drawSparkle(ctx, x, y, r, rot){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.quadraticCurveTo(0, 0, 0, r);
  ctx.quadraticCurveTo(0, 0, -r, 0);
  ctx.quadraticCurveTo(0, 0, 0, -r);
  ctx.fill();
  ctx.restore();
}

// Sparkle shower → rust wash fills in → cheer scales into place → fades out (tap to skip).
function celebrate(){
  if(activeCelebration) activeCelebration.close(true);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const el = document.createElement('div');
  el.className = 'celebrate';
  el.innerHTML = '<div class="wash"></div><canvas></canvas><div class="msg" role="status"></div>';
  el.querySelector('.msg').textContent = pickCheer();
  document.body.appendChild(el);

  const canvas = el.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  ctx.scale(dpr, dpr);

  const count = reduce ? 0 : Math.min(420, Math.round(W*H/2200));
  const sparkles = Array.from({length:count}, ()=> newSparkle(W, H, true));
  const start = performance.now();
  let prev = start, raf = 0, closed = false;
  const timers = [];

  function frame(now){
    const t = now - start;
    const dt = Math.min(0.05, (now - prev)/1000);
    prev = now;
    // Sparkles start rust, then shift to a pale glint as the rust wash fills in behind them.
    const mix = Math.min(1, Math.max(0, (t - 550)/700));
    const r = Math.round(166 + 89*mix), g = Math.round(64 + 176*mix), b = Math.round(31 + 195*mix);
    ctx.clearRect(0, 0, W, H);
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    for(const s of sparkles){
      if(t < s.delay) continue;
      s.x += s.vx*dt; s.y += s.vy*dt; s.rot += s.spin*dt;
      if(s.y > H + 20 && t < 1800) Object.assign(s, newSparkle(W, H, false));
      const grow = Math.min(1, (t - s.delay)/250);
      ctx.globalAlpha = 0.55 + 0.45*Math.sin(t/140 + s.phase);
      drawSparkle(ctx, s.x, s.y, s.size*grow, s.rot);
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }
  if(!reduce) raf = requestAnimationFrame(frame);

  timers.push(setTimeout(()=> el.classList.add('show-wash'), reduce ? 0 : 550));
  timers.push(setTimeout(()=> el.classList.add('show-msg'), reduce ? 250 : 1150));
  timers.push(setTimeout(()=> close(), reduce ? 2200 : 3100));

  function close(immediate){
    if(closed) return;
    closed = true;
    timers.forEach(clearTimeout);
    if(activeCelebration === api) activeCelebration = null;
    const finish = ()=>{ cancelAnimationFrame(raf); el.remove(); };
    if(immediate) return finish();
    el.classList.add('out');
    setTimeout(finish, 450);
  }
  el.addEventListener('click', ()=>{ if(performance.now() - start > 400) close(); });

  const api = {close};
  activeCelebration = api;
}

async function save(){
  try{
    await fetch('/api/progress', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({checks, crossChecks, raceChecked, paceRun, paceWalk}),
    });
  }catch(e){ /* offline or API unavailable, continue without persistence */ }
}
async function load(){
  try{
    const res = await fetch('/api/progress', {cache: 'no-store'});
    if(!res.ok) return;
    const data = await res.json();
    if(data){
      if(Array.isArray(data.checks) && data.checks.length === sessions.length){
        checks = data.checks;
      }
      if(data.crossChecks) crossChecks = Object.assign(crossChecks, data.crossChecks);
      raceChecked = !!data.raceChecked;
      if(data.paceRun > 0) paceRun = data.paceRun;
      if(data.paceWalk > 0) paceWalk = data.paceWalk;
    }
  }catch(e){ /* no saved progress yet */ }
}

(async function init(){
  buildTable();
  wireEvents();
  await load();
  syncCheckboxes();
  render();
})();
</script>
</body>
</html>
