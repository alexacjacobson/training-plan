<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kelsey's 5K Training Plan</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/appicon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="5K Tracker">
<meta name="theme-color" content="#A6401F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FBF6EC;
    --paper-line:#E4D3B8;
    --ink:#4A2E1C;
    --muted:#8A6A48;
    --pumpkin:#D9772E;
    --rust:#A6401F;
    --mustard:#E0A937;
    --done-bg:#E3DED2;
    --done-text:#8C8478;
    --shadow:0 1px 3px rgba(90,50,20,0.08), 0 2px 8px rgba(90,50,20,0.06);
    --shadow-hover:0 2px 6px rgba(90,50,20,0.12), 0 4px 14px rgba(90,50,20,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
  }
  button{font:inherit;}

  /* Header */
  .top{
    background:var(--rust);
    padding:18px 20px;
  }
  .top-inner{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
  }
  .top h1{
    font-family:'Playfair Display',serif;
    color:#FFF5E4;
    font-size:30px;
    margin:0;
    letter-spacing:0.3px;
  }
  .top p{
    margin:2px 0 0;
    color:#FBE3C2;
    font-size:13.5px;
    font-weight:600;
  }
  .icon-btn{
    width:44px;height:44px;
    flex-shrink:0;
    display:grid;
    place-items:center;
    border:none;
    border-radius:12px;
    background:rgba(255,245,228,0.14);
    color:#FFF5E4;
    cursor:pointer;
    transition:background .2s;
  }
  .icon-btn:hover{background:rgba(255,245,228,0.26);}
  .icon-btn:focus-visible{outline:2px solid #FFF5E4;outline-offset:2px;}

  .page{max-width:560px;margin:0 auto;padding-inline:16px;}
  .page.wide{max-width:840px;}

  /* Week view */
  .week-nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    margin:26px 0 4px;
  }
  .week-title{text-align:center;}
  .week-title h2{
    font-family:'Playfair Display',serif;
    font-size:34px;
    color:var(--rust);
    margin:0;
    line-height:1.1;
  }
  .week-title span{font-size:14px;font-weight:600;color:var(--muted);}
  .nav-btn{
    width:44px;height:44px;
    flex-shrink:0;
    border:none;
    border-radius:50%;
    background:#fff;
    color:var(--rust);
    font-size:24px;
    line-height:1;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .nav-btn.lock{font-size:17px;}
  .nav-btn:disabled{opacity:.4;cursor:default;box-shadow:none;}
  .week-progress{
    text-align:center;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    margin:4px 0 18px;
  }
  .cards{display:flex;flex-direction:column;gap:12px;}
  label.card{
    display:flex;
    align-items:center;
    gap:14px;
    background:#fff;
    border-radius:14px;
    padding:16px 18px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:background .2s, box-shadow .2s;
  }
  label.card:hover{box-shadow:var(--shadow-hover);}
  label.card input{
    width:22px;height:22px;
    margin:0;
    flex-shrink:0;
    accent-color:var(--rust);
  }
  .card .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;}
  .card .eyebrow{
    font-size:11px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#9A7B54;
  }
  .card .label{font-size:17px;font-weight:600;line-height:1.3;}
  .card .meta{font-size:13px;font-weight:700;color:#9A7B54;white-space:nowrap;}
  .card.cross .label{color:#6B7A5E;}
  .card.race .label{color:var(--rust);font-weight:700;}
  label.card.done, label.task.done{background:var(--done-bg);box-shadow:none;}
  .done .label{text-decoration:line-through;color:var(--done-text) !important;}

  .unlock{margin:24px 0 36px;text-align:center;}
  .btn{
    font-weight:700;
    font-size:15px;
    border:none;
    border-radius:999px;
    padding:12px 22px;
    cursor:pointer;
    box-shadow:var(--shadow);
  }
  .btn.primary{background:var(--rust);color:#FFF5E4;}
  .btn.secondary{background:#fff;color:var(--rust);}
  .btn:hover{box-shadow:var(--shadow-hover);}
  .unlock .hint{font-size:13.5px;font-weight:600;color:var(--muted);margin:0;}

  /* Full plan view */
  .view-title{
    font-family:'Playfair Display',serif;
    font-size:28px;
    color:var(--rust);
    margin:26px 0 2px;
  }
  .view-sub{margin:0 0 6px;font-size:13px;font-weight:600;color:var(--muted);}
  .scroll-hint{
    text-align:center;
    font-size:10.5px;
    color:#9A7B54;
    padding:6px 0 0;
    font-weight:600;
  }
  .table-wrap{
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
    padding:8px 4px 4px;
  }
  table{border-collapse:collapse; width:max-content; min-width:100%;}
  td.wk{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:13px;
    color:var(--rust);
    white-space:nowrap;
    padding:5px 10px 5px 8px;
    vertical-align:middle;
    width:92px;
    position:sticky;
    left:0;
    background:var(--paper);
    z-index:2;
    box-shadow:2px 0 5px rgba(90,50,20,0.06);
  }
  td.wk span{
    display:block;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-weight:600;
    font-size:9.5px;
    color:var(--muted);
  }
  .wk-link{
    background:none;
    border:none;
    padding:0;
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:13px;
    color:var(--rust);
    cursor:pointer;
    text-decoration:underline;
    text-decoration-color:var(--paper-line);
    text-underline-offset:3px;
  }
  .wk-link:hover{text-decoration-color:var(--rust);}
  .mini-unlock{
    display:block;
    margin-top:4px;
    border:none;
    border-radius:999px;
    padding:3px 9px;
    background:var(--rust);
    color:#FFF5E4;
    font-size:10px;
    font-weight:700;
    cursor:pointer;
  }
  .row{border-bottom:1px dashed var(--paper-line);}
  .row:last-child{border-bottom:none;}
  .cell{
    padding:4px 5px;
    vertical-align:middle;
    width:170px;
    min-width:170px;
  }
  .cell.wide{width:220px; min-width:220px;}
  label.task{
    display:flex;
    align-items:flex-start;
    gap:5px;
    background:#fff;
    border-radius:9px;
    padding:5px 7px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:background .2s, box-shadow .2s;
    min-height:34px;
  }
  label.task:hover{box-shadow:var(--shadow-hover);}
  label.task input{
    margin-top:2px;
    accent-color:var(--rust);
    width:14px;height:14px;
    flex-shrink:0;
  }
  .task .label{font-size:11.3px;line-height:1.25;font-weight:600;}
  .cross .task .label{color:#6B7A5E;}
  .race .task .label{font-weight:700;color:var(--rust);}
  .row.locked label.task{opacity:.5;cursor:not-allowed;}

  .tracker{
    margin:16px 0 36px;
    padding:14px 18px;
    background:#fff;
    border-radius:14px;
    box-shadow:var(--shadow);
  }
  .tracker h2{
    font-family:'Playfair Display',serif;
    font-size:16px;
    margin:0 0 8px;
    color:var(--ink);
  }
  .bar-wrap{
    position:relative;
    background:#EADFC5;
    border:1px solid var(--paper-line);
    border-radius:20px;
    height:20px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--mustard),var(--pumpkin),var(--rust));
    transition:width .5s ease;
    border-radius:20px 0 0 20px;
  }
  .stats{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    font-weight:700;
    margin-top:6px;
  }
  .tracker .fine{font-weight:500;font-size:10.5px;color:var(--muted);display:block;margin-top:3px;}

  /* Home view */
  body.on-home{background:var(--rust);}
  .home-link{color:inherit;text-decoration:none;}
  .home{padding-block:52px 40px;}
  .home-inner{max-width:560px;margin:0 auto;padding-inline:16px;}
  .hello{
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:clamp(38px,9vw,56px);
    line-height:1.12;
    color:#FFF5E4;
    margin:0;
  }
  .hello .word{
    display:inline-block;
    opacity:0;
    filter:blur(12px);
    transform:translateY(4px);
    animation:blurIn .7s ease forwards;
    animation-delay:calc(var(--i) * 150ms);
  }
  @keyframes blurIn{to{opacity:1;filter:blur(0);transform:none;}}
  .countdown{
    margin:14px 0 30px;
    font-size:16px;
    font-weight:600;
    color:#FBE3C2;
    opacity:0;
    animation:fadeIn .6s ease forwards;
    animation-delay:1.1s;
  }
  @keyframes fadeIn{to{opacity:1;}}
  .home-panel{
    background:var(--paper);
    border-radius:22px;
    padding:24px 18px 18px;
    box-shadow:0 10px 30px rgba(60,20,5,0.25);
  }
  .completed-title{
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin:26px 0 10px 2px;
  }
  .race-name{
    font-family:'Playfair Display',serif;
    font-size:28px;
    color:var(--rust);
    margin:0;
    line-height:1.15;
  }
  .plan-name{margin:2px 0 18px;font-size:13.5px;font-weight:600;color:var(--muted);}
  .week-list{display:flex;flex-direction:column;gap:10px;}
  .week-card{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    width:100%;
    text-align:left;
    background:#fff;
    color:var(--ink);
    border:none;
    border-radius:14px;
    padding:15px 18px;
    cursor:pointer;
    box-shadow:var(--shadow);
    transition:box-shadow .2s;
  }
  .week-card:hover{box-shadow:var(--shadow-hover);}
  .week-card:disabled{background:#F1ECE2;box-shadow:none;cursor:default;opacity:.6;}
  .week-card.completed{background:var(--done-bg);box-shadow:none;}
  .week-card.completed .wc-title,
  .week-card.completed .wc-dates{color:var(--done-text);}
  .week-card.completed .wc-end{font-size:20px;color:var(--done-text);}
  .wc-body{display:flex;flex-direction:column;gap:1px;}
  .wc-tag{
    font-size:11px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#9A7B54;
  }
  .wc-title{font-family:'Playfair Display',serif;font-weight:700;font-size:21px;color:var(--rust);}
  .week-card:disabled .wc-title{color:var(--ink);}
  .wc-dates{font-size:13px;font-weight:600;color:var(--muted);}
  .wc-end{font-size:24px;color:var(--rust);flex-shrink:0;}
  .week-card:disabled .wc-end{font-size:17px;}
  .week-card.current .wc-end{
    width:36px;height:36px;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:var(--rust);
    color:#FFF5E4;
    font-size:22px;
  }
  @media (prefers-reduced-motion:reduce){
    .hello .word, .countdown{animation:none;opacity:1;filter:none;transform:none;}
  }

  /* Celebration overlay */
  .celebrate{
    position:fixed;
    inset:0;
    z-index:1000;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:opacity .45s ease;
  }
  .celebrate .wash{
    position:fixed;
    inset:0;
    background:var(--rust);
    opacity:0;
    transition:opacity .7s ease;
  }
  .celebrate canvas{position:fixed;inset:0;width:100%;height:100%;}
  .celebrate .msg{
    position:relative;
    font-family:'Playfair Display',serif;
    font-weight:700;
    font-size:clamp(34px,8vw,64px);
    line-height:1.15;
    color:#fff;
    text-align:center;
    padding:0 24px;
    opacity:0;
    transform:scale(.7);
    transition:opacity .5s ease, transform .65s cubic-bezier(.2,.9,.3,1.25);
  }
  .celebrate .msg-title{display:block;}
  .celebrate .msg-sub{
    display:block;
    max-width:22em;
    margin:14px auto 0;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-weight:600;
    font-size:clamp(17px,4.6vw,24px);
    line-height:1.35;
    text-wrap:balance;
    color:#FFF5E4;
    opacity:0;
    transform:translateY(8px);
    transition:opacity .5s ease .35s, transform .5s ease .35s;
  }
  /* Week-complete version: stays open with a recap card, next-week button and close ✕ */
  .celebrate.big{cursor:default;overflow-y:auto;padding:72px 16px 32px;}
  /* Sparkles and stars fade away as the recap and next-week button come in. */
  .celebrate.big .wash{transition:opacity 1.1s ease;}
  .celebrate.big.show-msg canvas{opacity:0;transition:opacity 1.2s ease 1s;}
  /* Little sparkles that twinkle in and out behind the recap once it's up. */
  .twinkles{position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity 1s ease 1.4s;}
  .celebrate.show-msg .twinkles{opacity:1;}
  .twinkles svg{
    position:absolute;
    height:auto;
    opacity:0;
    transform:translate(-50%,-50%) scale(.4);
    animation:twinkle ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:0;transform:translate(-50%,-50%) scale(.4) rotate(0deg);}
    50%{opacity:.9;transform:translate(-50%,-50%) scale(1) rotate(45deg);}
  }
  .celebrate.big .msg{margin:auto;padding:0;width:100%;max-width:460px;}
  .celebrate .recap{
    margin:26px auto 0;
    background:var(--paper);
    color:var(--ink);
    border-radius:18px;
    padding:16px 18px 14px;
    text-align:left;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    box-shadow:0 10px 30px rgba(60,20,5,0.3);
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s ease 1.2s, transform .5s ease 1.2s;
  }
  .recap-head{
    font-size:12px;
    font-weight:700;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:4px;
  }
  .recap-list{list-style:none;margin:0;padding:0;}
  .recap-list li{
    display:flex;
    align-items:center;
    gap:12px;
    padding:9px 0;
    border-bottom:1px dashed var(--paper-line);
  }
  .recap-check{
    width:24px;height:24px;
    flex-shrink:0;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:var(--rust);
    color:#FFF5E4;
    font-size:13px;
    font-weight:700;
  }
  .recap-body{flex:1;min-width:0;display:flex;flex-direction:column;}
  .recap-eyebrow{
    font-size:10.5px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#9A7B54;
  }
  .recap-label{font-size:15px;font-weight:600;line-height:1.3;}
  .recap-meta{font-size:13px;font-weight:700;color:#9A7B54;white-space:nowrap;}
  .recap-total{
    display:flex;
    justify-content:space-between;
    padding-top:12px;
    font-size:15px;
    font-weight:700;
    color:var(--rust);
  }
  .celebrate-next{
    margin-top:22px;
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-weight:700;
    font-size:16px;
    padding:14px 28px;
    border:none;
    border-radius:999px;
    background:#FFF5E4;
    color:var(--rust);
    cursor:pointer;
    box-shadow:0 6px 18px rgba(60,20,5,0.3);
    opacity:0;
    transform:translateY(10px);
    transition:opacity .5s ease 1.6s, transform .5s ease 1.6s;
  }
  .celebrate-close{
    position:fixed;
    top:16px;
    right:16px;
    z-index:1;
    width:44px;height:44px;
    display:grid;
    place-items:center;
    border:none;
    border-radius:50%;
    background:rgba(255,245,228,0.16);
    color:#FFF5E4;
    cursor:pointer;
    opacity:0;
    transition:opacity .4s ease .3s, background .2s;
  }
  .celebrate-close:hover{background:rgba(255,245,228,0.28);}
  .celebrate-next:focus-visible, .celebrate-close:focus-visible{outline:2px solid #FFF5E4;outline-offset:3px;}
  .celebrate:not(.show-msg) .celebrate-next,
  .celebrate:not(.show-msg) .celebrate-close{pointer-events:none;}

  .celebrate.show-wash .wash{opacity:1;}
  .celebrate.show-msg .msg{opacity:1;transform:scale(1);}
  .celebrate.show-msg .msg-sub,
  .celebrate.show-msg .recap,
  .celebrate.show-msg .celebrate-next{opacity:1;transform:none;}
  .celebrate.show-msg .celebrate-close{opacity:1;}
  .celebrate.out{opacity:0;}
  @media (prefers-reduced-motion:reduce){
    .celebrate .msg, .celebrate .msg-sub, .celebrate .recap, .celebrate-next{transform:none;}
    .twinkles svg{animation:none;opacity:.5;transform:translate(-50%,-50%);}
  }
  @media (max-width:480px){
    .top h1{font-size:23px;}
    .week-title h2{font-size:30px;}
    .card .label{font-size:16px;}
    .task .label{font-size:10.5px;}
  }
</style>
</head>
<body class="on-home">

<section class="home" id="homeView" hidden>
  <div class="home-inner">
    <h1 class="hello" id="hello"></h1>
    <p class="countdown" id="countdown"></p>
    <div class="home-panel">
      <h2 class="race-name">Golden Gate 5K</h2>
      <p class="plan-name">Kelsey's 5K Training Plan · Sunday, Nov 1, 2026</p>
      <div class="week-list" id="weekList"></div>
      <div id="completedSection" hidden>
        <h3 class="completed-title">Completed</h3>
        <div class="week-list" id="completedList"></div>
      </div>
    </div>
  </div>
</section>

<header class="top" id="topBar">
  <div class="top-inner">
    <div>
      <h1><a href="#" class="home-link" data-home>Kelsey's 5K Training Plan</a></h1>
      <p>Golden Gate 5K · Sunday, Nov 1, 2026</p>
    </div>
    <button type="button" class="icon-btn" id="viewToggle" aria-label="Show full plan"></button>
  </div>
</header>

<main>
  <section class="page" id="weekView"></section>

  <section class="page wide" id="planView" hidden>
    <h2 class="view-title">Full plan</h2>
    <p class="view-sub">Tap a week to open it</p>
    <div class="scroll-hint">← swipe to see the full week →</div>
    <div class="table-wrap">
      <table id="plan"></table>
    </div>

    <div class="tracker">
      <h2>🍁 Mileage Tracker</h2>
      <div class="bar-wrap"><div class="bar-fill" id="barFill"></div></div>
      <div class="stats">
        <span id="statMiles">0.0 mi logged</span>
        <span id="statTime">0 min moved</span>
      </div>
      <span class="fine" id="statFine"></span>
    </div>
  </section>
</main>

<script>
const sessions = [
  {wk:1, dates:"Sep 14–20", label:"Run 1 min / Walk 2 min ×6", run:6, walk:12},
  {wk:1, dates:"Sep 14–20", label:"Run 1 min / Walk 2 min ×6", run:6, walk:12},
  {wk:1, dates:"Sep 14–20", label:"Run 1 min / Walk 2 min ×6", run:6, walk:12},

  {wk:2, dates:"Sep 21–27", label:"Run 2 min / Walk 2 min ×5", run:10, walk:10},
  {wk:2, dates:"Sep 21–27", label:"Run 2 min / Walk 2 min ×5", run:10, walk:10},
  {wk:2, dates:"Sep 21–27", label:"Run 2 min / Walk 2 min ×5", run:10, walk:10},

  {wk:3, dates:"Sep 28–Oct 4", label:"Run 3 min / Walk 2 min ×4", run:12, walk:8},
  {wk:3, dates:"Sep 28–Oct 4", label:"Run 3 min / Walk 2 min ×4", run:12, walk:8},
  {wk:3, dates:"Sep 28–Oct 4", label:"Run 3 min / Walk 2 min ×4", run:12, walk:8},

  {wk:4, dates:"Oct 5–11", label:"Run 5 min / Walk 2 min ×3", run:15, walk:6},
  {wk:4, dates:"Oct 5–11", label:"Run 5 min / Walk 2 min ×3", run:15, walk:6},
  {wk:4, dates:"Oct 5–11", label:"Run 5 min / Walk 2 min ×3", run:15, walk:6},

  {wk:5, dates:"Oct 12–18", label:"Run 8 min / Walk 1.5 min ×2 + Run 5 min", run:21, walk:3},
  {wk:5, dates:"Oct 12–18", label:"Run 8 min / Walk 1.5 min ×2 + Run 5 min", run:21, walk:3},
  {wk:5, dates:"Oct 12–18", label:"Run 10 min / Walk 2 min ×2 (longest)", run:20, walk:4},

  {wk:6, dates:"Oct 19–25", label:"Run 12 min / Walk 1 min ×2", run:24, walk:2},
  {wk:6, dates:"Oct 19–25", label:"Run 15 min / Walk 2 min / Run 8 min", run:23, walk:2},
  {wk:6, dates:"Oct 19–25", label:"Dress rehearsal: 20–25 min continuous", run:25, walk:0},

  {wk:7, dates:"Oct 26–Nov 1", label:"Easy 15 min jog/walk", run:10, walk:5},
  {wk:7, dates:"Oct 26–Nov 1", label:"10 min shakeout jog", run:10, walk:0},
];
const WEEK_COUNT = 7;
const RACE_WEEK = 7;
const RACE_WEEK_START = new Date(2026, 9, 26); // Mon Oct 26, 2026

const ICON_CALENDAR = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>';
const ICON_CLOSE = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';

// Defaults for a first visit; overridden by paces saved with progress.
let paceRun = 12;   // min per mile, easy jog
let paceWalk = 20;  // min per mile, relaxed walk
function distFor(s){ return s.run/paceRun + s.walk/paceWalk; }

let checks = new Array(sessions.length).fill(false);
let crossChecks = {1:false,2:false,3:false,4:false,5:false,6:false,7:false};
let raceChecked = false;
let unlockedWeek = 1;   // highest week Kelsey has unlocked
let currentWeek = 1;    // week shown in the week view
let view = 'home';      // 'home' | 'week' | 'plan'

const homeView = document.getElementById('homeView');
const topBar = document.getElementById('topBar');
const weekView = document.getElementById('weekView');
const planView = document.getElementById('planView');
const table = document.getElementById('plan');
const viewToggle = document.getElementById('viewToggle');

// Checkbox keys: "s<sessionIdx>", "c<week>" (cross-train), "race".
function isChecked(key){
  if(key === 'race') return raceChecked;
  if(key[0] === 'c') return !!crossChecks[key.slice(1)];
  return !!checks[+key.slice(1)];
}
function setChecked(key, on){
  if(key === 'race') raceChecked = on;
  else if(key[0] === 'c') crossChecks[key.slice(1)] = on;
  else checks[+key.slice(1)] = on;
}
function keyWeek(key){
  if(key === 'race') return RACE_WEEK;
  if(key[0] === 'c') return +key.slice(1);
  return sessions[+key.slice(1)].wk;
}

function weekItems(wk){ return sessions.map((s,idx)=>({...s, idx})).filter(s => s.wk === wk); }
function weekDates(wk){ return weekItems(wk)[0].dates; }
function weekDone(wk){ return weekItems(wk).every(s => checks[s.idx]); }
// For progress saved before weeks could be unlocked: unlock through the first unfinished week.
function deriveUnlocked(){
  let u = 1;
  while(u < WEEK_COUNT && weekDone(u)) u++;
  return u;
}
// A week only stays unlocked while every earlier week is complete; relock (and clear) anything past that.
function syncUnlocks(){
  const reachable = deriveUnlocked();
  if(unlockedWeek <= reachable) return false;
  unlockedWeek = reachable;
  clearLockedChecks();
  currentWeek = Math.min(currentWeek, unlockedWeek);
  return true;
}

function cardHTML({key, eyebrow, label, meta, cls}){
  const on = isChecked(key);
  return `<label class="card ${cls || ''} ${on ? 'done' : ''}">
    <input type="checkbox" data-key="${key}" ${on ? 'checked' : ''}>
    <span class="body"><span class="eyebrow">${eyebrow}</span><span class="label">${label}</span></span>
    ${meta ? `<span class="meta">${meta}</span>` : ''}
  </label>`;
}

function renderWeek(){
  const wk = currentWeek;
  const items = weekItems(wk);
  const done = items.filter(s => checks[s.idx]).length;
  const next = wk + 1;
  const nextLocked = wk < WEEK_COUNT && next > unlockedWeek;

  let cards = items.map((s,k)=> cardHTML({
    key:'s'+s.idx, eyebrow:`Workout ${k+1}`, label:s.label, meta:`${s.run + s.walk} min`,
  })).join('');
  cards += cardHTML({key:'c'+wk, eyebrow:'Optional', label:'🧘🚴 Cross-train: yoga or spin', cls:'cross'});
  if(wk === RACE_WEEK){
    cards += cardHTML({key:'race', eyebrow:'Sunday, Nov 1 · Race day', label:'🏁 Golden Gate 5K', meta:'3.1 mi', cls:'race'});
  }

  let unlock = '';
  if(wk < WEEK_COUNT){
    if(!nextLocked) unlock = `<button type="button" class="btn secondary" data-nav="1">Go to Week ${next} →</button>`;
    else if(done === items.length) unlock = `<button type="button" class="btn primary" data-unlock="${next}">🔓 Unlock Week ${next}</button>`;
    else unlock = `<p class="hint">🔒 Finish all ${items.length} workouts to unlock Week ${next}</p>`;
  }

  weekView.innerHTML = `
    <div class="week-nav">
      <button type="button" class="nav-btn" data-nav="-1" aria-label="Previous week" ${wk === 1 ? 'disabled' : ''}>‹</button>
      <div class="week-title"><h2>Week ${wk}</h2><span>${weekDates(wk)}</span></div>
      <button type="button" class="nav-btn ${nextLocked ? 'lock' : ''}" data-nav="1"
        aria-label="${nextLocked ? `Week ${next} is locked` : 'Next week'}"
        ${wk === WEEK_COUNT || nextLocked ? 'disabled' : ''}>${nextLocked ? '🔒' : '›'}</button>
    </div>
    <p class="week-progress">${done} of ${items.length} workouts done</p>
    <div class="cards">${cards}</div>
    <div class="unlock">${unlock}</div>`;
}

function taskCell(key, label, locked, cls){
  const on = isChecked(key);
  return `<td class="cell ${cls || ''}">
    <label class="task ${on ? 'done' : ''}">
      <input type="checkbox" data-key="${key}" ${on ? 'checked' : ''} ${locked ? 'disabled' : ''}>
      <span class="label">${label}</span>
    </label>
  </td>`;
}
function weekCell(wk, locked, dates){
  if(!locked) return `<td class="wk"><button type="button" class="wk-link" data-goto="${wk}">Week ${wk}</button><span>${dates}</span></td>`;
  const canUnlock = wk === unlockedWeek + 1 && weekDone(unlockedWeek);
  return `<td class="wk">Week ${wk} 🔒<span>${dates}</span>${canUnlock ? `<button type="button" class="mini-unlock" data-unlock="${wk}">Unlock</button>` : ''}</td>`;
}

function renderPlan(){
  let html = '';
  for(let wk = 1; wk <= WEEK_COUNT; wk++){
    const locked = wk > unlockedWeek;
    const cells = weekItems(wk).map(s => taskCell('s'+s.idx, s.label, locked)).join('')
      + taskCell('c'+wk, '🧘🚴 Cross-train (optional)', locked, 'wide cross');
    html += `<tr class="row ${locked ? 'locked' : ''}">${weekCell(wk, locked, weekDates(wk))}${cells}</tr>`;
  }
  const raceLocked = unlockedWeek < RACE_WEEK;
  html += `<tr class="row race ${raceLocked ? 'locked' : ''}"><td class="wk">Week ${RACE_WEEK}<span>Nov 1</span></td>
    ${taskCell('race', '🏁 RACE DAY — Golden Gate 5K (3.1 mi)', raceLocked, 'wide').replace('<td ', '<td colspan="4" ')}</tr>`;
  table.innerHTML = html;

  let totalMiles = 0, totalMin = 0, planMiles = 0;
  sessions.forEach((s,idx)=>{
    planMiles += distFor(s);
    if(checks[idx]){ totalMiles += distFor(s); totalMin += s.run + s.walk; }
  });
  const pct = Math.min(100, (totalMiles/planMiles)*100);
  document.getElementById('barFill').style.width = pct + "%";
  document.getElementById('statMiles').textContent = totalMiles.toFixed(1) + " mi logged";
  document.getElementById('statTime').textContent = totalMin + " min moved";
  document.getElementById('statFine').textContent = raceChecked
    ? "🏁 Race complete — 3.1 miles, and every step before it! 🍂"
    : "Estimated at your jog/walk paces · " + planMiles.toFixed(1) + " training mi planned, then 3.1 mi on race day";
}

function weeksToRaceWeek(){
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  return Math.ceil((RACE_WEEK_START - today) / (7 * 86400000));
}

function renderHome(){
  const n = weeksToRaceWeek();
  document.getElementById('countdown').textContent =
    n > 1 ? `${n} weeks to race week` : n === 1 ? '1 week to race week' : "It's race week! 🏁";

  const weekCard = (wk, {cls = '', attrs, tag, end, status = ''}) => {
    const tags = [tag, wk === RACE_WEEK && 'Race week'].filter(Boolean).join(' · ');
    return `<button type="button" class="week-card ${cls}" ${attrs}
        aria-label="Week ${wk}, ${weekDates(wk)}${status ? ', ' + status : ''}">
      <span class="wc-body">
        ${tags ? `<span class="wc-tag">${tags}</span>` : ''}
        <span class="wc-title">Week ${wk}</span>
        <span class="wc-dates">${weekDates(wk)}</span>
      </span>
      <span class="wc-end" aria-hidden="true">${end}</span>
    </button>`;
  };

  let upcoming = '', completed = '';
  for(let wk = 1; wk <= WEEK_COUNT; wk++){
    if(wk <= unlockedWeek && homeWeekDone(wk)){
      completed += weekCard(wk, {cls:'completed', attrs:`data-goto="${wk}"`, tag:'Completed', end:'✓', status:'completed'});
    } else if(wk === unlockedWeek + 1 && weekDone(unlockedWeek)){
      upcoming += weekCard(wk, {cls:'current', attrs:`data-unlock="${wk}"`, tag:'Ready to unlock', end:'🔓', status:'ready to unlock'});
    } else if(wk > unlockedWeek){
      upcoming += weekCard(wk, {attrs:'disabled', end:'🔒', status:'locked'});
    } else {
      const current = wk === unlockedWeek;
      upcoming += weekCard(wk, {cls: current ? 'current' : '', attrs:`data-goto="${wk}"`, tag: current && 'This week', end:'›'});
    }
  }
  document.getElementById('weekList').innerHTML = upcoming;
  document.getElementById('completedList').innerHTML = completed;
  document.getElementById('completedSection').hidden = !completed;
}

// A week moves to "Completed" on the home page once every workout is checked (plus the race, in race week).
function homeWeekDone(wk){
  return weekDone(wk) && (wk !== RACE_WEEK || raceChecked);
}

// "Welcome back" once she has logged anything; a first-visit welcome before that.
function greeting(){
  const returning = loggedCount() > 0 || unlockedWeek > 1;
  return returning ? "Hey Kelsey, welcome back!" : "Welcome, Kelsey :-)";
}

// Rebuilds the greeting so each word blurs into view in turn.
function playHello(){
  const hello = document.getElementById('hello');
  const text = greeting();
  hello.setAttribute('aria-label', text);
  hello.innerHTML = text.split(' ')
    .map((w, i) => `<span class="word" aria-hidden="true" style="--i:${i}">${w}</span>`)
    .join(' ');
  const countdown = document.getElementById('countdown');
  countdown.style.animation = 'none';
  void countdown.offsetWidth;
  countdown.style.animation = '';
}

function renderAll(){
  // Re-rendering replaces the checkboxes, so carry keyboard focus over to the new one.
  const focusKey = document.activeElement && document.activeElement.dataset.key;
  renderHome();
  renderWeek();
  renderPlan();
  if(focusKey){
    const container = view === 'week' ? weekView : planView;
    const el = container.querySelector(`[data-key="${focusKey}"]`);
    if(el) el.focus({preventScroll:true});
  }
}

function showView(v){
  view = v;
  homeView.hidden = v !== 'home';
  topBar.hidden = v === 'home';
  weekView.hidden = v !== 'week';
  planView.hidden = v !== 'plan';
  document.body.classList.toggle('on-home', v === 'home');
  if(v === 'home') playHello();
  viewToggle.innerHTML = v === 'plan' ? ICON_CLOSE : ICON_CALENDAR;
  viewToggle.setAttribute('aria-label', v === 'plan' ? 'Back to this week' : 'Show full plan');
  window.scrollTo(0, 0);
}

document.addEventListener('change', e=>{
  const key = e.target.dataset && e.target.dataset.key;
  if(!key) return;
  const on = e.target.checked;
  const wk = keyWeek(key);
  const wasWeekDone = homeWeekDone(wk);
  setChecked(key, on);
  if(!on) syncUnlocks();
  renderAll();
  // The check that finishes a week gets the bigger week celebration.
  if(on) celebrate(!wasWeekDone && homeWeekDone(wk) ? wk : null);
  save();
});

document.addEventListener('click', e=>{
  if(e.target.closest('[data-home]')){
    e.preventDefault();
    showView('home');
    return;
  }
  const nav = e.target.closest('[data-nav]');
  if(nav){
    currentWeek = Math.min(unlockedWeek, Math.max(1, currentWeek + Number(nav.dataset.nav)));
    renderWeek();
    window.scrollTo(0, 0);
    return;
  }
  const unlock = e.target.closest('[data-unlock]');
  if(unlock){
    const wk = Number(unlock.dataset.unlock);
    unlockedWeek = Math.max(unlockedWeek, wk);
    currentWeek = wk;
    renderAll();
    showView('week');
    save();
    return;
  }
  const go = e.target.closest('[data-goto]');
  if(go){
    currentWeek = Number(go.dataset.goto);
    renderWeek();
    showView('week');
    return;
  }
  if(e.target.closest('#viewToggle')) showView(view === 'week' ? 'plan' : 'week');
});

const CHEERS = ["Nice one!", "Way to push it!", "Great effort today!", "Way to get after it!"];
const REPEAT_CHEER = "She did it again!";
let lastCheer = null;
let activeCelebration = null;

function loggedCount(){
  return checks.filter(Boolean).length
    + Object.values(crossChecks).filter(Boolean).length
    + (raceChecked ? 1 : 0);
}
function pickCheer(){
  // Called after the new check is recorded, so >1 means something was already logged.
  const pool = loggedCount() > 1 ? [...CHEERS, REPEAT_CHEER] : CHEERS;
  const options = pool.filter(c => c !== lastCheer);
  lastCheer = options[Math.floor(Math.random()*options.length)];
  return lastCheer;
}

const FESTIVE_COLORS = ['#E0A937', '#F3C280', '#FFF5E4', '#D9772E', '#FFD27A', '#F2B8A0', '#C9D6A8'];
const randomFestive = ()=> FESTIVE_COLORS[Math.floor(Math.random()*FESTIVE_COLORS.length)];

function newSparkle(W, H, initial, big){
  const star = big && Math.random() < 0.35;
  return {
    x: Math.random()*W,
    y: initial ? Math.random()*H : -10 - Math.random()*40,
    vx: (Math.random()-0.5)*50,
    vy: 60 + Math.random()*180,
    size: star ? 6 + Math.random()*9 : 3 + Math.random()*9,
    rot: Math.random()*Math.PI,
    spin: (Math.random()-0.5)*3,
    phase: Math.random()*Math.PI*2,
    delay: initial ? Math.random()*650 : 0,
    star,
    color: big ? randomFestive() : null,
  };
}
function drawStar(ctx, x, y, r, rot){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.beginPath();
  for(let i = 0; i < 10; i++){
    const radius = i % 2 ? r*0.45 : r;
    const a = -Math.PI/2 + i*Math.PI/5;
    ctx.lineTo(Math.cos(a)*radius, Math.sin(a)*radius);
  }
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// iOS Safari has no vibration API, but toggling a native switch control plays a system haptic tick.
function hapticTap(){
  try{
    const label = document.createElement('label');
    label.setAttribute('aria-hidden', 'true');
    label.style.display = 'none';
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.setAttribute('switch', '');
    label.appendChild(input);
    document.head.appendChild(label);
    label.click();
    label.remove();
  }catch(e){ /* haptics are a nice-to-have */ }
}
// Plays a tick at each offset (ms); uses the vibration API where it exists (Android).
function playHaptics(offsets, timers){
  if(typeof navigator.vibrate === 'function'){
    // Browsers ignore vibration until the person has actually tapped the page.
    if(navigator.userActivation && !navigator.userActivation.hasBeenActive) return;
    const pattern = [];
    let end = 0;
    offsets.forEach((o, i)=>{
      if(i) pattern.push(Math.max(0, o - end));
      pattern.push(20);
      end = o + 20;
    });
    navigator.vibrate(pattern);
    return;
  }
  offsets.forEach(o => o === 0 ? hapticTap() : timers.push(setTimeout(hapticTap, o)));
}
function drawSparkle(ctx, x, y, r, rot){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot);
  ctx.beginPath();
  ctx.moveTo(0, -r);
  ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.quadraticCurveTo(0, 0, 0, r);
  ctx.quadraticCurveTo(0, 0, -r, 0);
  ctx.quadraticCurveTo(0, 0, 0, -r);
  ctx.fill();
  ctx.restore();
}

function recapRow(eyebrow, label, meta){
  return `<li>
    <span class="recap-check" aria-hidden="true">✓</span>
    <span class="recap-body"><span class="recap-eyebrow">${eyebrow}</span><span class="recap-label">${label}</span></span>
    ${meta ? `<span class="recap-meta">${meta}</span>` : ''}
  </li>`;
}
function weekRecapHTML(wk){
  const done = weekItems(wk).map((s, k)=> ({...s, n:k+1})).filter(s => checks[s.idx]);
  let rows = done.map(s => recapRow(`Workout ${s.n}`, s.label, `${s.run + s.walk} min`)).join('');
  if(crossChecks[wk]) rows += recapRow('Optional', '🧘🚴 Cross-train: yoga or spin', '');
  let miles = done.reduce((sum, s)=> sum + distFor(s), 0);
  if(wk === RACE_WEEK && raceChecked){
    rows += recapRow('Race day', '🏁 Golden Gate 5K', '3.1 mi');
    miles += 3.1;
  }
  const minutes = done.reduce((sum, s)=> sum + s.run + s.walk, 0);
  return `<div class="recap">
    <div class="recap-head">Week ${wk} recap</div>
    <ul class="recap-list">${rows}</ul>
    <div class="recap-total"><span>${minutes} min moved</span><span>~${miles.toFixed(1)} mi</span></div>
  </div>`;
}

// Sparkle shower → rust wash fills in → cheer scales into place → fades out (tap to skip).
// Pass a week number for the week-complete version: multicolor stars and a recap card that
// stays open until she taps "Check out Week N" or the close ✕.
function celebrate(week){
  if(activeCelebration) activeCelebration.close(true);
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const big = week != null;
  const T = big ? {wash:900, msg:2100} : {wash:550, msg:1150, close:3100};

  const el = document.createElement('div');
  el.className = 'celebrate';
  el.innerHTML = '<div class="wash"></div><canvas></canvas><div class="msg" role="status"></div>';
  const msg = el.querySelector('.msg');
  if(big){
    const nextLabel = week < WEEK_COUNT ? `Check out Week ${week + 1}` : 'Back to home';
    el.classList.add('big');
    el.setAttribute('role', 'dialog');
    el.setAttribute('aria-modal', 'true');
    el.setAttribute('aria-label', `Week ${week} complete`);
    msg.removeAttribute('role');
    msg.innerHTML = `<span class="msg-title"></span><span class="msg-sub"></span>
      ${weekRecapHTML(week)}
      <button type="button" class="celebrate-next">${nextLabel}</button>`;
    msg.querySelector('.msg-title').textContent = 'Congrats Kelsey!';
    msg.querySelector('.msg-sub').textContent = `You just completed Week ${week}'s workouts. Great job!`;
    el.insertAdjacentHTML('beforeend', `<button type="button" class="celebrate-close" aria-label="Close">${ICON_CLOSE}</button>`);
    // Placed before the message so the twinkles sit behind the recap card.
    msg.insertAdjacentHTML('beforebegin', `<div class="twinkles" aria-hidden="true">${Array.from({length:22}, ()=>
      `<svg viewBox="0 0 24 24" style="left:${(Math.random()*100).toFixed(1)}%;top:${(Math.random()*100).toFixed(1)}%;width:${11 + Math.round(Math.random()*13)}px;color:${randomFestive()};animation-duration:${(2.2 + Math.random()*2).toFixed(2)}s;animation-delay:${(Math.random()*3).toFixed(2)}s"><path d="M12 0Q12 12 24 12Q12 12 12 24Q12 12 0 12Q12 12 12 0Z" fill="currentColor"/></svg>`
    ).join('')}</div>`);
  } else {
    msg.textContent = pickCheer();
  }
  document.body.appendChild(el);

  const canvas = el.querySelector('canvas');
  const ctx = canvas.getContext('2d');
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W*dpr; canvas.height = H*dpr;
  ctx.scale(dpr, dpr);

  const count = reduce ? 0 : Math.min(big ? 560 : 420, Math.round(W*H/(big ? 1600 : 2200)));
  const sparkles = Array.from({length:count}, ()=> newSparkle(W, H, true, big));
  const burst = [];
  const start = performance.now();
  let prev = start, raf = 0, closed = false;
  const timers = [];

  // Stars that shoot out from behind the message as it appears.
  function spawnBurst(){
    for(let i = 0; i < 44; i++){
      const a = Math.random()*Math.PI*2, speed = 250 + Math.random()*450;
      burst.push({
        x: W/2, y: H/2,
        vx: Math.cos(a)*speed, vy: Math.sin(a)*speed - 120,
        size: 5 + Math.random()*9,
        rot: Math.random()*Math.PI, spin: (Math.random()-0.5)*8,
        color: randomFestive(), age: 0, life: 1.2 + Math.random()*0.8,
      });
    }
  }

  function frame(now){
    const t = now - start;
    const dt = Math.min(0.05, (now - prev)/1000);
    prev = now;
    // Sparkles start rust, then shift to a pale glint as the rust wash fills in behind them.
    const mix = Math.min(1, Math.max(0, (t - T.wash)/700));
    const r = Math.round(166 + 89*mix), g = Math.round(64 + 176*mix), b = Math.round(31 + 195*mix);
    const glint = `rgb(${r},${g},${b})`;
    ctx.clearRect(0, 0, W, H);
    for(const s of sparkles){
      if(t < s.delay) continue;
      s.x += s.vx*dt; s.y += s.vy*dt; s.rot += s.spin*dt;
      const keepFalling = t < (big ? T.msg : T.close - 1200);
      if(s.y > H + 20 && keepFalling) Object.assign(s, newSparkle(W, H, false, big));
      const grow = Math.min(1, (t - s.delay)/250);
      ctx.globalAlpha = 0.55 + 0.45*Math.sin(t/140 + s.phase);
      ctx.fillStyle = s.color || glint;
      (s.star ? drawStar : drawSparkle)(ctx, s.x, s.y, s.size*grow, s.rot);
    }
    for(const p of burst){
      p.age += dt;
      if(p.age > p.life) continue;
      p.vy += 520*dt;
      p.x += p.vx*dt; p.y += p.vy*dt; p.rot += p.spin*dt;
      ctx.globalAlpha = 1 - p.age/p.life;
      ctx.fillStyle = p.color;
      drawStar(ctx, p.x, p.y, p.size, p.rot);
    }
    ctx.globalAlpha = 1;
    raf = requestAnimationFrame(frame);
  }
  if(!reduce) raf = requestAnimationFrame(frame);

  playHaptics(big
    ? [0, 90, 180, 270, 360, 450, 560, 680, 820, 980, 1160, 1380, 1640, T.msg, T.msg + 90, T.msg + 180, T.msg + 420]
    : [0, 110, T.msg], timers);

  timers.push(setTimeout(()=> el.classList.add('show-wash'), reduce ? 0 : T.wash));
  timers.push(setTimeout(()=>{
    el.classList.add('show-msg');
    if(big){
      if(!reduce) spawnBurst();
      el.querySelector('.celebrate-next').focus({preventScroll:true});
      // Once the sparkle layer has faded out, stop drawing it.
      timers.push(setTimeout(()=> cancelAnimationFrame(raf), 2400));
    }
  }, reduce ? 250 : T.msg));
  if(!big) timers.push(setTimeout(()=> close(), reduce ? T.close - 900 : T.close));

  function close(immediate){
    if(closed) return;
    closed = true;
    timers.forEach(clearTimeout);
    document.removeEventListener('keydown', onKey);
    if(typeof navigator.vibrate === 'function' && (!navigator.userActivation || navigator.userActivation.hasBeenActive)){
      navigator.vibrate(0);
    }
    if(activeCelebration === api) activeCelebration = null;
    const finish = ()=>{ cancelAnimationFrame(raf); el.remove(); };
    if(immediate) return finish();
    el.classList.add('out');
    setTimeout(finish, 450);
  }
  // ✕ (or Esc) goes back to the week she just finished.
  function backToWeek(){
    close();
    currentWeek = week;
    renderWeek();
    showView('week');
  }
  // "Check out Week N" unlocks the next week and opens it.
  function goToNextWeek(){
    close();
    if(week >= WEEK_COUNT){ showView('home'); return; }
    unlockedWeek = Math.max(unlockedWeek, week + 1);
    currentWeek = week + 1;
    renderAll();
    showView('week');
    save();
  }
  function onKey(e){ if(e.key === 'Escape') backToWeek(); }

  if(big){
    el.addEventListener('click', e=>{
      if(e.target.closest('.celebrate-next')) goToNextWeek();
      else if(e.target.closest('.celebrate-close')) backToWeek();
    });
    document.addEventListener('keydown', onKey);
  } else {
    el.addEventListener('click', ()=>{ if(performance.now() - start > 400) close(); });
  }

  const api = {close};
  activeCelebration = api;
}

async function save(){
  try{
    await fetch('/api/progress', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({checks, crossChecks, raceChecked, paceRun, paceWalk, unlockedWeek}),
    });
  }catch(e){ /* offline or API unavailable, continue without persistence */ }
}
async function load(){
  try{
    const res = await fetch('/api/progress', {cache: 'no-store'});
    if(!res.ok) return;
    const data = await res.json();
    if(data){
      if(Array.isArray(data.checks) && data.checks.length === sessions.length){
        checks = data.checks;
      }
      if(data.crossChecks) crossChecks = Object.assign(crossChecks, data.crossChecks);
      raceChecked = !!data.raceChecked;
      if(data.paceRun > 0) paceRun = data.paceRun;
      if(data.paceWalk > 0) paceWalk = data.paceWalk;
      unlockedWeek = Number.isInteger(data.unlockedWeek)
        ? Math.min(WEEK_COUNT, Math.max(1, data.unlockedWeek))
        : deriveUnlocked();
    }
  }catch(e){ /* no saved progress yet */ }
}

// Weeks that aren't unlocked yet can't have progress; revert any stray checks to incomplete.
function clearLockedChecks(){
  let changed = false;
  sessions.forEach((s,idx)=>{
    if(s.wk > unlockedWeek && checks[idx]){ checks[idx] = false; changed = true; }
  });
  Object.keys(crossChecks).forEach(wk=>{
    if(+wk > unlockedWeek && crossChecks[wk]){ crossChecks[wk] = false; changed = true; }
  });
  if(RACE_WEEK > unlockedWeek && raceChecked){ raceChecked = false; changed = true; }
  return changed;
}

(async function init(){
  // Wait for saved progress so the greeting and week cards are right on first paint.
  await load();
  const relocked = syncUnlocks();
  if(clearLockedChecks() || relocked) save();
  currentWeek = unlockedWeek;
  renderAll();
  showView('home');
})();
</script>
</body>
</html>
